<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪ブルテオン×枚方寝屋川消防組合 選手アンケートクイズ</title>
<style>
  :root{
    --blue:#1446a0; --blue-dark:#0b2a66; --blue-light:#e8f0ff;
    --red:#d62828; --green:#1a9e5c; --gray:#6b7280; --line:#d6deec;
    --bg:#f4f7fc; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    background:var(--bg);color:#1f2937;line-height:1.6;min-height:100vh;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;text-align:center;position:relative}
  header .sub{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px 14px}
  header h1{font-size:21px;font-weight:900;margin-top:8px;line-height:1.35}
  .lang{display:inline-flex;margin-top:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
  .lang button{border:none;background:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700;
    padding:4px 14px;border-radius:999px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--blue-dark)}
  main{max-width:560px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:1}
  .card{background:var(--white);border-radius:16px;padding:20px 18px;box-shadow:0 2px 10px rgba(11,42,102,.08);margin-bottom:16px}
  .lead{font-size:15px}
  .lead strong{color:var(--blue)}
  h2{font-size:18px;color:var(--blue-dark);margin-bottom:10px}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .05s}
  .btn:active{transform:scale(.98)}
  .btn-main{background:var(--red);color:#fff}
  .btn-main:disabled{background:#c9ced8;cursor:default}
  .btn-sub{background:var(--white);color:var(--blue);border:2px solid var(--blue)}
  .btn-row{display:flex;gap:10px;margin-top:16px}
  .btn-row .btn{flex:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;font-size:15px;
    font-weight:600;cursor:pointer;text-align:center;font-family:inherit;color:#1f2937;line-height:1.35}
  .opt.sel{border-color:var(--blue);background:var(--blue-light);color:var(--blue-dark)}
  .opt:disabled{opacity:.4;cursor:default}
  .grid .opt{word-break:keep-all;overflow-wrap:anywhere}
  .opt small{display:block;font-size:11px;font-weight:400;color:var(--gray)}
  .list{display:flex;flex-direction:column;gap:10px}
  .list .opt{text-align:left;padding:14px 16px;font-size:16px}
  .progress{display:flex;gap:5px;margin-bottom:14px}
  .progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .progress span.done{background:var(--blue)}
  .qno{font-size:14px;color:var(--blue);font-weight:800;margin-bottom:8px}
  .askbox{background:var(--blue-light);border-left:6px solid var(--blue);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .askbox .lbl{font-size:12px;font-weight:700;color:var(--blue)}
  .qtext{font-size:19px;font-weight:800;margin-top:2px;line-height:1.5;color:#1f2937}
  .guide{background:#fff6e0;border:2px solid #f5c400;border-radius:12px;padding:10px 14px;margin-bottom:14px}
  .guide .who{font-size:17px;font-weight:900;color:var(--blue-dark)}
  .guide .how{font-size:14px;font-weight:700;color:#7a5a00;margin-top:2px}
  .steps{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .steps li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
  .steps .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;
    font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .rule{margin-top:14px;background:#fdecec;color:var(--red);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:800;text-align:center}
  .sub-hint{font-size:14px;color:var(--gray);margin:-4px 0 12px}
  .player-tag{display:inline-block;background:var(--blue-dark);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;margin-bottom:10px}
  input[type=text]{width:100%;font-size:26px;text-align:center;padding:14px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--blue)}
  .score{text-align:center;padding:10px 0 4px}
  .score .big{font-size:56px;font-weight:900;color:var(--red);line-height:1.1}
  .score .big small{font-size:20px;color:#1f2937}
  .score .msg{font-size:16px;font-weight:700;margin-top:6px}
  .res{border-top:1px solid var(--line);padding:12px 0}
  .res:first-child{border-top:none}
  .res .head{display:flex;gap:10px;align-items:flex-start}
  .mark{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px}
  .mark.ok{background:var(--green)} .mark.ng{background:var(--red)}
  .res .q{font-size:14px;font-weight:700}
  .res .a{font-size:13px;color:var(--gray);margin-top:3px}
  .res .a b{color:#1f2937}
  .res .note{font-size:13px;background:var(--blue-light);border-radius:8px;padding:6px 10px;margin-top:6px}
  .center{text-align:center}
  .muted{color:var(--gray);font-size:13px}
  .err{color:var(--red);font-size:14px}
  .testbar{background:#fff3cd;color:#8a5a00;border:2px dashed #e0a800;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;font-weight:700;text-align:center}
  #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;transition:opacity .5s ease;overflow:hidden;
    background:linear-gradient(105deg,#0b2a66 0%,#1446a0 49.8%,#c81e1e 50.2%,#e03131 100%)}
  #splash .title{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.35)}
  #splash .title .tl,#splash .title .tr{font-size:min(9.5vw,56px);font-weight:900;letter-spacing:.04em;white-space:nowrap;line-height:1.25}
  #splash .title .tl{animation:fromLeft .8s cubic-bezier(.2,.8,.2,1) both}
  #splash .title .tr{animation:fromRight .8s cubic-bezier(.2,.8,.2,1) both}
  #splash .x{font-size:min(9vw,48px);margin:.1em 0;color:#fff;font-weight:700;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.3);
    animation:pop .5s .75s cubic-bezier(.3,1.6,.5,1) both}
  #splash .names{margin-top:26px;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35);animation:fadeIn .8s .8s ease both}
  #splash .names .n{font-size:min(4.3vw,26px);font-weight:800;letter-spacing:.02em;white-space:nowrap}
  #splash .names .n span{margin:0 .5em;font-weight:400}
  #splash .names .c{display:inline-block;font-size:min(5vw,24px);font-weight:800;margin-top:10px;letter-spacing:.3em;
    padding:4px 14px 4px 18px;border:2px solid #fff;border-radius:999px}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .stage1{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
  #splash .stage1 .title,#splash .stage1 .names{transition:transform .5s cubic-bezier(.3,1.5,.5,1) .12s}
  #splash.s1out .stage1 .title{transform:translateY(var(--ly,-31vh)) scale(var(--ls,.72))}
  #splash.s1out .stage1 .names{transform:translateY(var(--ny,30vh))}
  /* バレーボール */
  #splash .ballwrap{position:absolute;left:50%;top:50%;width:min(95vmin,620px);height:min(95vmin,620px);
    margin:calc(min(95vmin,620px)/-2) 0 0 calc(min(95vmin,620px)/-2);opacity:0;pointer-events:none;z-index:2}
  #splash .ballwrap svg{width:100%;height:100%;filter:drop-shadow(0 20px 30px rgba(0,0,0,.45))}
  #splash.ballgo .ballwrap{animation:spike .62s cubic-bezier(.55,0,.95,.5) both}
  #splash.impact .ballwrap{animation:settle 1.9s linear both}
  @keyframes spike{0%{opacity:0;transform:translate(30vw,-38vh) scale(.04) rotate(0)}
    8%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1) rotate(620deg)}}
  @keyframes settle{
    0%{opacity:1;transform:translate(0,0) scale(1.08,.94) rotate(620deg);animation-timing-function:ease-out}
    10%{transform:translate(0,0) scale(1) rotate(630deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}
    38%{transform:translate(calc(var(--bx,30vw)*-.35),var(--by,30vh)) scale(var(--bf,.2),calc(var(--bf,.2)*.85)) rotate(700deg);animation-timing-function:cubic-bezier(0,.4,.5,1)}
    50%{transform:translate(calc(var(--bx,30vw)*-.1),calc(var(--by,30vh) - 9vh)) scale(var(--bf,.2)) rotate(760deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}
    62%{transform:translate(calc(var(--bx,30vw)*.15),var(--by,30vh)) scale(var(--bf,.2),calc(var(--bf,.2)*.92)) rotate(820deg);animation-timing-function:cubic-bezier(0,.4,.5,1)}
    70%{transform:translate(calc(var(--bx,30vw)*.3),calc(var(--by,30vh) - 2.5vh)) scale(var(--bf,.2)) rotate(860deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}
    77%{transform:translate(calc(var(--bx,30vw)*.45),var(--by,30vh)) scale(var(--bf,.2)) rotate(900deg);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
    100%{opacity:1;transform:translate(var(--bx,30vw),var(--by,30vh)) scale(var(--bf,.2)) rotate(1080deg)}}
  /* 画面に当たった演出 */
  #splash .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
  #splash.impact .flash{animation:flash .45s ease-out both}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  #splash.impact{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}
    30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}}
  /* クイズにチャレンジ！！ */
  #splash .challenge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:4;opacity:0;pointer-events:none;text-align:center;padding:20px}
  #splash.impact .challenge{opacity:1}
  #splash .challenge .ct{font-size:min(11.5vw,80px);white-space:nowrap;font-weight:900;line-height:1.15;color:#fff;letter-spacing:.02em;
    -webkit-text-stroke:min(1.6vw,9px) var(--blue-dark);paint-order:stroke fill;
    text-shadow:0 6px 0 var(--red),0 12px 24px rgba(0,0,0,.4)}
  #splash.impact .challenge .ct{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes slam{0%{transform:scale(3) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-4deg);opacity:1}}
  #splash .challenge .tap{margin-top:34px;font-size:min(4.6vw,22px);font-weight:800;color:#fff;
    background:rgba(11,42,102,.55);border:2px solid #fff;border-radius:999px;padding:8px 22px;opacity:0}
  #splash.impact .challenge .tap{animation:fadeIn .5s 1s ease both, blink 1.2s 1.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes fromLeft{0%{transform:translateX(-70vw);opacity:0}100%{transform:none;opacity:1}}
  @keyframes fromRight{0%{transform:translateX(70vw);opacity:0}100%{transform:none;opacity:1}}
  @keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  @keyframes fadeUp{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
  .when{text-align:center;font-size:12px;color:var(--gray);margin-top:6px}
  .staff{text-align:center}
  .nowlabel{font-size:12px;color:var(--gray)}
  .clock{font-size:30px;font-weight:900;color:var(--blue-dark);font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-bottom:12px}
  .staff .show{font-size:18px;font-weight:800;color:var(--blue-dark);margin-bottom:12px}
  .staff .muted{margin-top:8px}
  .btn-check{background:var(--green);color:#fff}
  .checked{display:inline-block;font-size:24px;font-weight:900;color:var(--green);border:4px solid var(--green);
    border-radius:12px;padding:6px 18px;transform:rotate(-4deg)}
  .checkbar{background:#e8f6ee;color:#11683c;border-color:var(--green)}
  .otherbox{margin-top:12px}
  .otherbox label{display:block;font-size:13px;font-weight:700;color:var(--blue-dark);margin-bottom:6px}
  input.other{font-size:17px;text-align:left}
  .opt.soon{background:#f3f4f6;border-style:dashed;color:#9ca3af;opacity:1}
  .soonbadge{display:block;width:max-content;margin:5px auto 0;font-size:10px;font-weight:800;letter-spacing:.08em;
    color:#fff;background:#9ca3af;border-radius:999px;padding:1px 9px}
  .opt.pl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px 11px;position:relative;overflow:hidden}
  .opt.pl .no{display:inline-flex;align-items:baseline;gap:2px;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-style:italic;font-weight:900;font-size:24px;line-height:1;letter-spacing:-.02em;
    background:linear-gradient(135deg,#0b2a66 0%,#1446a0 55%,#2f6fe0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    padding:0 4px}
  .opt.pl .no small{font-size:10px;font-weight:900;letter-spacing:0;-webkit-text-fill-color:#1446a0;opacity:.75}
  .opt.pl .nm{font-size:14px;line-height:1.35}
  .opt.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(#1446a0,#2f6fe0)}
  .opt.pl.sel{background:linear-gradient(135deg,#0b2a66,#1446a0);border-color:#0b2a66;color:#fff}
  .opt.pl.sel .no{background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff}
  .opt.pl.sel .no small{-webkit-text-fill-color:#cfe0ff}
  .opt.pl.sel::before{background:#f5c400}
  .opt.pl.soon .no{background:none;color:#b8bec9}
  .opt.pl.soon .no small{-webkit-text-fill-color:#b8bec9}
  .opt.pl.soon::before{background:#d1d5db}
  /* ===== トップ画面（スタジアム風） ===== */
  body.is-top{background:
      radial-gradient(ellipse 60% 35% at 8% 0%,rgba(255,255,255,.55),transparent 70%),
      radial-gradient(ellipse 60% 35% at 92% 2%,rgba(255,255,255,.5),transparent 70%),
      linear-gradient(180deg,#06215e 0%,#0d3a99 30%,#1557d0 65%,#1b63e0 100%);min-height:100vh}
  body.is-top::before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;opacity:.22;
    background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.6px);background-size:9px 9px;
    -webkit-mask-image:linear-gradient(115deg,#000 0%,transparent 35%,transparent 65%,#000 100%);mask-image:linear-gradient(115deg,#000 0%,transparent 35%,transparent 65%,#000 100%)}
  body.is-top header{display:none}
  body.is-top footer{color:rgba(255,255,255,.75)}
  body.is-top main{padding-top:calc(10px + env(safe-area-inset-top))}
  .hero{position:relative;margin:0 -16px;padding:18px 16px 70px;overflow:hidden}
  .hero .netbg{position:absolute;right:-30px;top:120px;width:75%;height:150px;transform:skewY(-9deg);opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
    background-size:14px 14px;border-top:5px solid rgba(255,255,255,.9)}
  .hero .crowd{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:96px;color:#04184a;opacity:.85}
  .hero-in{position:relative;z-index:1}
  .hpill{display:inline-block;color:#fff;font-weight:800;font-size:min(4vw,16px);border:2px solid rgba(255,255,255,.85);
    border-radius:999px;padding:5px 16px;background:rgba(6,33,94,.35);transform:rotate(-2deg)}
  .htitle{margin-top:12px;font-weight:900;font-style:italic;line-height:1.05;color:#fff;transform:rotate(-4deg) skewX(-6deg);transform-origin:left}
  .htitle span{display:block;font-size:min(10.2vw,52px);letter-spacing:-.01em;
    -webkit-text-stroke:min(1.6vw,8px) #072a7a;paint-order:stroke fill;text-shadow:0 5px 0 #041a52,0 10px 24px rgba(0,0,0,.35)}
  .swoosh{display:block;width:88%;height:24px;margin-top:-4px;transform:rotate(-4deg)}
  .hball{position:absolute;right:-14px;top:34px;width:min(19vw,100px);aspect-ratio:1}
  .hball svg:first-child{width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));animation:hspin 9s linear infinite}
  .hball .trail{position:absolute;left:-55%;bottom:-38%;width:90%;height:auto;z-index:-1}
  @keyframes hspin{to{transform:rotate(360deg)}}
  .hlang{display:flex;width:max-content;margin:18px auto 0;background:rgba(6,33,94,.45);border:2px solid rgba(255,255,255,.75)}
  .hlang button{font-size:15px;padding:6px 20px}
  .hcard{position:relative;margin-top:-56px;z-index:2;border-radius:22px;padding:22px 18px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
  .hh2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .hh2 .slashes{display:flex;gap:3px;flex:none}
  .hh2 .slashes i{display:block;width:5px;height:30px;background:#2f6fe0;transform:skewX(-20deg);border-radius:2px}
  .hh2 .slashes i+i{background:#f5c400}
  .hh2t{font-size:22px;font-weight:900;font-style:italic;color:var(--blue-dark);
    background:linear-gradient(transparent 72%,#ffe066 72%,#ffe066 92%,transparent 92%)}
  .hsteps{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .hsteps li{display:flex;align-items:center;gap:12px;background:var(--blue-light);border-radius:14px;padding:12px}
  .hsteps .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue-dark);color:#fff;font-weight:900;
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .hsteps .ic{flex:none;width:38px;height:38px;color:var(--blue-dark)}
  .hsteps .ic svg{width:100%;height:100%;fill:currentColor;stroke:currentColor}
  .hsteps .ic svg[fill="none"]{fill:none}
  .hsteps .tx{font-size:15px;font-weight:700;line-height:1.5}
  .hrule{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:#fde3e3;color:var(--red);
    border-radius:12px;padding:10px 10px;font-size:min(3.8vw,15px);font-weight:900;white-space:nowrap}
  .hrule .wi{width:24px;height:24px;flex:none}
  .hrule .wi svg{width:100%;height:100%}
  .btn-go{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:14px;width:88%;margin:22px auto 0;
    border:3px solid #fff;border-radius:999px;padding:16px;font-family:inherit;font-size:21px;font-weight:900;color:#0b2a66;cursor:pointer;
    background:linear-gradient(180deg,#ffe45c,#f5c400);box-shadow:0 6px 0 #b98f00,0 12px 24px rgba(0,0,0,.3)}
  .btn-go:active{transform:translateY(3px);box-shadow:0 3px 0 #b98f00,0 6px 14px rgba(0,0,0,.3)}
  .btn-go .chev{font-size:30px;line-height:1;margin-top:-4px}
  .court{height:90px;margin:24px -16px 0;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.18));
    clip-path:polygon(0 30%,100% 30%,100% 100%,0 100%)}
  .court::before{content:"";position:absolute;inset:0;
    background:linear-gradient(#fff,#fff) 0 30%/100% 3px no-repeat,
      linear-gradient(73deg,transparent 49%,#fff 49.5%,#fff 50.5%,transparent 51%) -40% 0/60% 100% no-repeat,
      linear-gradient(-73deg,transparent 49%,#fff 49.5%,#fff 50.5%,transparent 51%) 140% 0/60% 100% no-repeat;opacity:.8}
  body.is-top .testbar{margin-top:6px}
  footer{text-align:center;font-size:11px;color:var(--gray);padding:10px 0 24px}
</style>
</head>
<body>
<div id="splash">
  <div class="stage1">
    <div class="title">
      <div class="tl">大阪ブルテオン</div>
      <div class="x">×</div>
      <div class="tr">枚方寝屋川消防組合</div>
    </div>
    <div class="names">
      <div class="c">コラボ企画</div>
    </div>
  </div>
  <div class="ballwrap">
    <svg viewBox="0 0 100 100" aria-hidden="true">

}
function isReady(name){ return playerQs(name).length > 0; }

}

}
function loadPlay(){
  if (CHECK) return null;
  try{ const s = localStorage.getItem(playKey()); return s ? JSON.parse(s) : null; }catch(e){ return null; }
}

  const cur = state.answers[q.id] ?? "";
  let body = "";
  if (q.type === "choice"){
    body = `<div class="list">${q.options.map(o =>
      `<button class="opt ${cur===o.ja?"sel":""}" data-v="${esc(o.ja)}">${esc(o[lang])}</button>`).join("")}</div>`;
    if (q.options.some(o => o.ja === "その他")){
      body += `<div class="otherbox" id="otherbox" style="display:${cur==="その他"?"block":"none"}">
        <label for="other">${t().otherLbl}</label>
        <input type="text" id="other" class="other" maxlength="30" placeholder="${esc(t().otherPh)}" value="${esc(state.answers[q.id+"_other"]||"")}" autocomplete="off">
      </div>`;
    }
  } else if (q.type === "player"){
    body = `<div class="grid">${PLAYERS.map(p =>
      `<button class="opt pl ${cur===p.ja?"sel":""}" data-v="${esc(p.ja)}">${plInner(p)}</button>`).join("")}</div>`;
  } else {
    body = `<input type="text" id="kanji" maxlength="20" placeholder="${esc(t().placeholder)}" value="${esc(cur)}" autocomplete="off">`;
  }
  const last = state.step === QS.length - 1;
  app.innerHTML = `
    <div class="card">
      <div class="progress">${QS.map((_,i)=>`<span class="${i<=state.step?"done":""}"></span>`).join("")}</div>
      <div class="qno">${t().qno(state.step+1, QS.length)}</div>
      <div class="askbox">
        <div class="lbl">${t().askLbl}</div>
        <div class="qtext">${esc(q[lang])}</div>
      </div>
      <div class="guide">
        <div class="who">${esc(t().who(pName(state.player)))}</div>
        <div class="how">${q.type==="kanji" ? t().hintKanji : q.type==="player" ? t().hintPlayer : t().hintChoice}</div>
      </div>
      ${body}
      <div class="btn-row">
        ${state.step===0 ? "" : `<button class="btn btn-sub" id="back">${t().back}</button>`}
        <button class="btn btn-main" id="next" ${cur && !(cur==="その他" && !state.answers[q.id+"_other"]) ? "" : "disabled"}>${last ? t().check : t().next}</button>
      </div>
    </div>`;
  const next = document.getElementById("next");
  app.querySelectorAll(".opt[data-v]").forEach(b => b.onclick = () => {
    state.answers[q.id] = b.dataset.v; savePlay(false);
    app.querySelectorAll(".opt[data-v]").forEach(x => x.classList.toggle("sel", x === b));
    next.disabled = (b.dataset.v === "その他" && !state.answers[q.id+"_other"]);
    const ob = document.getElementById("otherbox");
    if (ob){
      const isOther = b.dataset.v === "その他";
      ob.style.display = isOther ? "block" : "none";
      if (isOther) setTimeout(() => { const o = document.getElementById("other"); if (o) o.focus(); }, 50);
    }
  });
  const oth = document.getElementById("other");
  if (oth) oth.oninput = () => { state.answers[q.id+"_other"] = oth.value.trim(); savePlay(false); next.disabled = !oth.value.trim(); };
  const k = document.getElementById("kanji");
  if (k){ k.oninput = () => { state.answers[q.id] = k.value.trim(); savePlay(false); next.disabled = !k.value.trim(); }; }
  const back = document.getElementById("back");
  if (back) back.onclick = () => { state.step--; savePlay(false); showQuestion(); };
  next.onclick = () => { if (last) { savePlay(true); showResult(); } else { state.step++; savePlay(false); showQuestion(); } };
  testBar();
  window.scrollTo(0,0);
}

/* ===== 判定 ===== */
// ひらがな・カタカナ・全角半角・大文字小文字・空白の違いをそろえる
function soft(x){
  return String(x ?? "").normalize("NFKC").toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s\u3000、。・,.!！?？「」()（）\/／]/g, "");
}
function bigrams(x){ const a = []; for (let i = 0; i < x.length - 1; i++) a.push(x.slice(i, i+2)); return a; }
function similar(a, b){
  if (a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  const A = bigrams(a), B = bigrams(b).slice(); let hit = 0;
  A.forEach(g => { const k = B.indexOf(g); if (k >= 0){ hit++; B.splice(k,1); } });
  return 2*hit / (A.length + bigrams(b).length);
}
// だいたい合っているか：キーワードが入っている／似ている
function roughMatch(typed, a, qid){
  const t = soft(typed); if (!t) return false;
  const words = String((a && a[qid+"_other_ok"]) || "").split(/[、,，]/).map(soft).filter(Boolean);
  const main = soft(a && a[qid+"_other"]);
  if (main) words.push(main);
  return words.some(w => t.includes(w) || (t.length >= 2 && w.includes(t)) || similar(t, w) >= 0.5);
}
const splitAns = s => String(s ?? "").split(/[、,，\/／]/).map(x => x.trim()).filter(Boolean);
function isCorrect(q, mine, correct){
  if (q.type === "kanji") return splitAns(correct).map(norm).includes(norm(mine));
  if (q.type === "player" && correct === "*") return true;   // 「全員」と答えた問題は誰を選んでも正解
  if (q.type === "choice" && correct === "その他") {
    // 「その他」は、選んだうえで中身がだいたい合っていれば正解
    return mine === "その他" && roughMatch(state.answers[q.id+"_other"], DATA.players[state.player], q.id);
  }
  return norm(mine) === norm(correct);
}

/* ===== 画面：結果 ===== */
function showResult(){
  document.body.classList.remove("is-top");
  state.screen = "result";
  const a = DATA.players[state.player];
  let ok = 0;
  const QS = playerQs(state.player);
  const rows = QS.map((q,i) => {
    const mine = state.answers[q.id];
    const correct = a[q.id];
    const hit = isCorrect(q, mine, correct);
    if (hit) ok++;
    let shown = q.type==="kanji" ? (a.q7_show || splitAns(correct)[0])
              : (q.type==="player" && correct==="*") ? t().everyone : valLabel(q, correct);
    if (q.id==="q1" && correct==="その他" && a.q1_other) shown += `（${a.q1_other}）`;
    let note = "";
    const reason = lang==="en" ? (a.q2_reason_en || a.q2_reason) : a.q2_reason;
    if (q.id==="q2" && reason) note = `<div class="note">${t().reason}：${esc(reason)}</div>`;
    const r7 = lang==="en" ? (a.q7_reason_en || a.q7_reason) : a.q7_reason;
    if (q.id==="q7" && r7) note = `<div class="note">${t().reason}：${esc(r7)}</div>`;
    return `<div class="res"><div class="head">
      <div class="mark ${hit?"ok":"ng"}">${hit?"○":"×"}</div>
      <div><div class="q">${t().qlabel(i+1)}　${esc(q[lang])}</div>
      <div class="a">${t().theirs}：<b>${esc(shown)}</b>　／　${t().yours}：${esc(valLabel(q, mine))}${mine==="その他" && state.answers[q.id+"_other"] ? `（${esc(state.answers[q.id+"_other"])}）` : ""}</div>${note}</div>
    </div></div>`;
  }).join("");
  const n = QS.length;
  app.innerHTML = `
    <div class="card">
      <span class="player-tag">${esc(pName(state.player))}${t().sama}</span>
      <div class="score">
        <div class="big">${ok}${t().correctOf(ok,n)}</div>
      </div>
      ${state.doneAt ? `<div class="when">${t().answeredAt}：${fmt(state.doneAt)}</div>` : ""}
    </div>
    <div class="card staff">
      <div class="nowlabel">${t().nowLabel}</div>
      <div class="clock" id="clock"></div>
      ${state.checkedAt
        ? `<div class="checked">✓ ${t().checked}</div><div class="when">${fmt(state.checkedAt)}</div>`
        : `<div class="show">${t().showStaff}</div>
           <button class="btn btn-check" id="chk">${t().checkBtn}</button>
           <div class="muted">${t().checkNote}</div>`}
    </div>
    <div class="card"><h2>${t().review}</h2>${rows}</div>
    ${CHECK ? `<button class="btn btn-main" id="again">${t().checkAgain}</button>`
            : `<p class="center muted">${t().doneNote}</p>`}`;
  const again = document.getElementById("again");
  if (again) again.onclick = () => { state = {screen:"select", player:null, step:0, answers:{}}; showSelect(); };
  const chk = document.getElementById("chk");
  if (chk) chk.onclick = showCheckConfirm;
  startClock();
  testBar();
  window.scrollTo(0,0);
}
let clockTimer = null;
function startClock(){
  clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById("clock");
    if (!el){ clearInterval(clockTimer); return; }
    const d = new Date(), z = v => String(v).padStart(2,"0");
    el.textContent = `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
  };
  tick(); clockTimer = setInterval(tick, 1000);
}
function fmt(ms){
  const d = new Date(ms), z = v => String(v).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
function showCheckConfirm(){
  const box = document.querySelector(".staff");
  box.innerHTML = `<div class="nowlabel">${t().nowLabel}</div><div class="clock" id="clock"></div>
    <div class="show">${t().checkQ}</div>
    <div class="btn-row">
      <button class="btn btn-sub" id="chkNo">${t().checkNo}</button>
      <button class="btn btn-check" id="chkYes">${t().checkYes}</button>
    </div>`;
  startClock();
  document.getElementById("chkNo").onclick = showResult;
  document.getElementById("chkYes").onclick = () => { state.checkedAt = Date.now(); savePlay(true); showResult(); };
}

/* ===== 起動時の演出：タイトル → スパイク → クイズにチャレンジ！！ ===== */
(function(){
  const sp = document.getElementById("splash");
  const TXT = {
    ja:{ct:"クイズに<br>チャレンジ！！", tap:"タップしてスタート"},
    en:{ct:"Take the<br>Quiz Challenge!!", tap:"Tap to start"}
  };
  let stage = 1, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  function toBall(){
    if (stage >= 2) return; stage = 2; clear();
    placeEdges();
    sp.classList.add("s1out", "ballgo");
    later(toImpact, 620);
  }
  function placeEdges(){
    // タイトルは画面の上へ、「コラボ企画」は画面の下へ（画面の大きさに合わせて計算）
    const H = window.innerHeight, m = Math.max(14, H*0.04);
    const lg = sp.querySelector(".title"), nm = sp.querySelector(".names");
    if (lg){
      const r = lg.getBoundingClientRect();
      const sc = Math.min(0.75, (H*0.24)/r.height);
      sp.style.setProperty("--ls", sc);
      sp.style.setProperty("--ly", (m + r.height*sc/2 - (r.top + r.height/2)) + "px");
    }
    let namesTop = H - m;
    if (nm){
      const r = nm.getBoundingClientRect();
      sp.style.setProperty("--ny", ((H - m - r.height/2) - (r.top + r.height/2)) + "px");
      namesTop = H - m - r.height;
    }
    // ボールが止まる場所：右下、文字のすぐ上
    const W = window.innerWidth, S = Math.min(Math.min(W,H)*0.95, 620);
    const d = Math.max(60, Math.min(W*0.22, H*0.13, 130)), f = d/S;
    sp.style.setProperty("--bf", f);
    sp.style.setProperty("--bx", (W/2 - d/2 - Math.max(16, W*0.06)) + "px");
    sp.style.setProperty("--by", (namesTop - 12 - d/2 - H/2) + "px");
  }
  function toImpact(){
    if (stage >= 3) return; stage = 3; clear();
    const L = TXT[lang] || TXT.ja;
    document.getElementById("spCt").innerHTML = L.ct;
    document.getElementById("spTap").textContent = L.tap;
    if (!sp.classList.contains("s1out")){ placeEdges(); sp.classList.add("s1out"); }
    sp.classList.remove("ballgo"); void sp.offsetWidth;
    sp.classList.add("impact");
    try{ if (navigator.vibrate) navigator.vibrate(60); }catch(e){}
    later(close, 6000);
  }
  function close(){
    if (stage >= 4) return; stage = 4; clear();
    sp.classList.add("hide"); setTimeout(() => sp.remove(), 600);
  }
  sp.onclick = () => {
    if (stage === 1) toBall();
    else if (stage === 2) toImpact();
    else if (stage === 3 && sp.classList.contains("impact")) close();
  };
  later(toBall, 2600);
})();

/* ===== 読み込み ===== */
setLang(lang);
fetch("answers.json?t=" + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d && d.players ? d : {players:{}};
    if (DATA.test && new URLSearchParams(location.search).get("reset")==="1"){
      try{ localStorage.removeItem(playKey()); }catch(e){}
    }
    const saved = loadPlay();
    if (saved && saved.player && DATA.players[saved.player]){
      state = {screen: saved.done ? "result" : "q", player:saved.player,
               step: Math.min(saved.step||0, playerQs(saved.player).length-1), answers: saved.answers||{},
               doneAt: saved.doneAt||null, checkedAt: saved.checkedAt||null};
    }
    loaded = true; render();
  })
  .catch(() => { loadFailed = true; render(); });
</script>
